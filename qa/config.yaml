# Dr. Orion "TestMaster" Vanguard - Superhuman QA Configuration
# Dr. Orion "TestMaster" Vanguard - Superhuman QA Configuration
# Comprehensive testing configuration for AI News Dashboard

# Global Configuration
global:
  project_name: "ai-news-dashboard"
  version: "1.0.0"
  environment: "development"  # development, staging, production
  timezone: "UTC"
  log_level: "INFO"

# Dashboard Configuration
dashboard:
  url: "http://localhost:3000"
  name: "AI News Dashboard"
  version: "1.0.0"
  environment: "development"

# QA Orchestrator Configuration
orchestrator:
  host: "0.0.0.0"
  port: 8080
  workers: 4
  max_concurrent_tests: 10
  test_timeout: 300  # seconds
  retry_attempts: 3
  
  # Test execution settings
  execution:
    parallel_personas: true
    max_parallel_personas: 5
    chaos_intensity: "medium"  # low, medium, high
    ai_inference_validation: true
    neural_cache_diagnostics: true
    
  # Reporting
  reporting:
    generate_html_reports: true
    generate_json_reports: true
    generate_junit_xml: true
    screenshot_on_failure: true
    video_recording: true

# Database Configuration
database:
  type: "redis"
  host: "localhost"
  port: 6379
  password: null
  database: 0
  connection_timeout: 5

# Vector Store Configuration
vector_store:
  type: "pinecone"  # or "weaviate", "chroma"
  api_key: "${PINECONE_API_KEY}"
  environment: "us-west1-gcp"
  index_name: "ai-news-embeddings"
  dimension: 1536
  metric: "cosine"

# AI Model Configuration
ai_models:
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4o"
    temperature: 0.1
    max_tokens: 2000
  
  claude:
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-3-5-sonnet-20241022"
    temperature: 0.1
    max_tokens: 2000

# AI Inference Validation
ai_inference:
  enabled: true
  models:
    summarization:
      primary: "gpt-4o"
      fallback: "claude-3.5-sonnet"
      max_tokens: 150
      temperature: 0.3
      
    entity_extraction:
      primary: "gpt-4o"
      entities: ["PERSON", "ORG", "GPE", "MONEY", "DATE"]
      
    sentiment_analysis:
      primary: "claude-3.5-sonnet"
      scale: "positive|neutral|negative"
      
  validation:
    golden_dataset_size: 100
    accuracy_threshold: 0.85
    hallucination_threshold: 0.05
    drift_detection_window: 24  # hours

# Chaos Engineering
chaos_engineering:
  enabled: true
  experiments:
    network_latency:
      enabled: true
      min_delay: 100  # ms
      max_delay: 2000  # ms
      duration: 60  # seconds
      
    cache_eviction:
      enabled: true
      eviction_percentage: 50
      target_caches: ["redis", "browser"]
      
    api_failures:
      enabled: true
      failure_rate: 0.1  # 10%
      endpoints: ["/api/news", "/api/search"]
      
    database_slowdown:
      enabled: true
      slowdown_factor: 2.0
      duration: 30  # seconds
      
    memory_pressure:
      enabled: true
      memory_limit: "512MB"
      duration: 45  # seconds

# Performance Testing
performance:
  load_testing:
    enabled: true
    concurrent_users: [10, 50, 100, 500, 1000]
    ramp_up_time: 60  # seconds
    test_duration: 300  # seconds
    
  stress_testing:
    enabled: true
    max_users: 2000
    breaking_point_detection: true
    
  endurance_testing:
    enabled: false
    duration: 3600  # 1 hour
    steady_users: 100

# Security Testing
security:
  enabled: true
  scans:
    owasp_zap:
      enabled: true
      scan_type: "full"  # quick, full
      target_urls:
        - "http://localhost:3000"
        - "http://localhost:3000/api"
        
    sql_injection:
      enabled: true
      payloads_file: "security/sql_payloads.txt"
      
    xss_testing:
      enabled: true
      payloads_file: "security/xss_payloads.txt"
      
    csrf_testing:
      enabled: true
      
    authentication:
      enabled: true
      test_weak_passwords: true
      test_session_management: true

# Accessibility Testing
accessibility:
  enabled: true
  standards: ["WCAG2.1-AA"]
  tools:
    axe_core: true
    lighthouse: true
    pa11y: true

# Browser Configuration
browsers:
  chrome:
    enabled: true
    version: "latest"
    headless: true
    options:
      - "--no-sandbox"
      - "--disable-dev-shm-usage"
      - "--disable-gpu"
      - "--window-size=1920,1080"
      
  firefox:
    enabled: true
    version: "latest"
    headless: true
    
  safari:
    enabled: false  # Not available in Docker
    
  edge:
    enabled: false  # Not available in Docker

# Persona Testing Configuration
persona_testing:
  personas:
    casual_reader:
      name: "Casual Reader"
      description: "Regular user browsing news casually"
      behavior_patterns:
        - "scroll_through_headlines"
        - "click_interesting_articles"
        - "spend_2_5_minutes_reading"
        - "occasional_search"
      device_preferences: ["desktop", "mobile"]
      performance_expectations:
        page_load_time_ms: 3000
        interaction_response_ms: 500
      
    breaking_news_alerter:
      name: "Breaking News Alerter"
      description: "Power user seeking real-time updates"
      behavior_patterns:
        - "frequent_refresh"
        - "filter_by_categories"
        - "quick_scan_headlines"
        - "share_articles"
      device_preferences: ["mobile", "tablet"]
      performance_expectations:
        page_load_time_ms: 1500
        interaction_response_ms: 200
    
    financial_analyst:
      name: "Financial Analyst"
      description: "Professional analyzing market-related news"
      behavior_patterns:
        - "search_specific_companies"
        - "filter_financial_news"
        - "deep_read_analysis"
        - "bookmark_articles"
      device_preferences: ["desktop"]
      performance_expectations:
        page_load_time_ms: 2000
        interaction_response_ms: 300
    
    mobile_commuter:
      name: "Mobile Commuter"
      description: "User reading news during commute"
      behavior_patterns:
        - "quick_headline_scan"
        - "touch_interactions"
        - "offline_reading"
        - "voice_search"
      device_preferences: ["mobile"]
      performance_expectations:
        page_load_time_ms: 2500
        interaction_response_ms: 400
    
    research_journalist:
      name: "Research Journalist"
      description: "Professional researcher doing deep analysis"
      behavior_patterns:
        - "advanced_search_queries"
        - "bulk_article_analysis"
        - "cross_reference_sources"
        - "export_data"
      device_preferences: ["desktop", "tablet"]
      performance_expectations:
        page_load_time_ms: 2000
        interaction_response_ms: 250

# AI Inference Validation Configuration
ai_inference_validation:
  test_data:
    summarization_samples:
      - input: "Breaking: Major tech company announces revolutionary AI breakthrough that could transform healthcare industry. The new system uses advanced machine learning algorithms to predict patient outcomes with 95% accuracy, potentially saving thousands of lives annually."
        expected_summary: "Tech company unveils AI system for healthcare that predicts patient outcomes with 95% accuracy, potentially saving thousands of lives."
        max_length: 100
      
      - input: "Climate change report reveals alarming trends in global temperature rise. Scientists warn that without immediate action, sea levels could rise by 2 meters by 2100, affecting millions of coastal residents worldwide."
        expected_summary: "New climate report warns of 2-meter sea level rise by 2100 without immediate action, threatening millions of coastal residents."
        max_length: 100
    
    rag_queries:
      - query: "What are the latest developments in artificial intelligence?"
        expected_topics: ["machine learning", "AI breakthrough", "technology", "innovation"]
        min_relevance_score: 0.8
      
      - query: "How is climate change affecting the economy?"
        expected_topics: ["climate change", "economic impact", "environmental policy", "sustainability"]
        min_relevance_score: 0.8
    
    news_exploration:
      - query: "technology stocks performance"
        expected_categories: ["technology", "finance", "business"]
        min_articles: 5
      
      - query: "renewable energy investments"
        expected_categories: ["energy", "environment", "business"]
        min_articles: 3
  
  validation_thresholds:
    summary_accuracy: 0.85
    topic_relevance: 0.80
    hallucination_detection: 0.95
    response_consistency: 0.90

# Chaos Engineering Configuration
chaos_engineering:
  experiments:
    network_latency:
      enabled: true
      latency_ms: [100, 500, 1000, 2000]
      duration_seconds: 30
      target_endpoints: ["/api/news", "/api/summarize", "/api/news-explorer"]
    
    cache_eviction:
      enabled: true
      cache_types: ["redis", "browser", "cdn"]
      eviction_percentage: [25, 50, 75, 100]
      duration_seconds: 60
    
    api_failure:
      enabled: true
      failure_rate: [0.1, 0.3, 0.5]
      duration_seconds: 45
      target_apis: ["news_ingestion", "summarization", "search"]
    
    database_stress:
      enabled: true
      concurrent_connections: [50, 100, 200]
      query_complexity: ["simple", "medium", "complex"]
      duration_seconds: 120
    
    memory_pressure:
      enabled: true
      memory_usage_percentage: [70, 85, 95]
      duration_seconds: 90
  
  recovery_expectations:
    max_recovery_time_seconds: 60
    acceptable_error_rate: 0.05
    performance_degradation_threshold: 0.20

# Neural Cache & Prefetch Configuration
neural_cache:
  cache_layers:
    redis:
      host: "localhost"
      port: 6379
      ttl_seconds: 3600
      max_memory: "256mb"
    
    browser:
      cache_control_max_age: 300
      etag_enabled: true
      compression: "gzip"
    
    cdn:
      provider: "cloudflare"  # or "aws_cloudfront", "azure_cdn"
      edge_cache_ttl: 1800
      origin_cache_ttl: 3600
    
    isr:
      revalidate_seconds: 60
      fallback_enabled: true
      static_generation: true
  
  prefetch_intelligence:
    user_behavior_tracking: true
    ml_prediction_model: "collaborative_filtering"
    prefetch_threshold: 0.7
    max_prefetch_items: 10
    prefetch_strategies:
      - "popular_articles"
      - "user_interest_based"
      - "trending_topics"
      - "time_based_patterns"
  
  vector_store_optimization:
    embedding_cache_size: 10000
    similarity_threshold: 0.85
    batch_query_size: 50
    index_refresh_interval: 300

# Multi-Agent QA Pipeline Configuration
multi_agent_pipeline:
  agents:
    functional_testing:
      enabled: true
      browser_automation: "selenium"  # or "playwright", "cypress"
      browsers: ["chrome", "firefox", "safari", "edge"]
      test_timeout_seconds: 30
      screenshot_on_failure: true
    
    performance_testing:
      enabled: true
      load_testing_tool: "jmeter"  # or "k6", "artillery"
      max_concurrent_users: 1000
      test_duration_seconds: 300
      ramp_up_time_seconds: 60
    
    security_testing:
      enabled: true
      security_scanner: "owasp_zap"  # or "burp_suite", "nessus"
      scan_depth: "medium"
      vulnerability_threshold: "medium"
    
    accessibility_testing:
      enabled: true
      wcag_level: "AA"
      testing_tool: "axe"  # or "lighthouse", "wave"
      color_contrast_ratio: 4.5
    
    cross_browser_testing:
      enabled: true
      browser_versions:
        chrome: ["latest", "latest-1"]
        firefox: ["latest", "latest-1"]
        safari: ["latest"]
        edge: ["latest"]
      mobile_devices: ["iPhone 12", "Samsung Galaxy S21", "iPad"]
    
    api_testing:
      enabled: true
      test_framework: "pytest"  # or "jest", "postman"
      rate_limit_testing: true
      schema_validation: true
      contract_testing: true
    
    integration_testing:
      enabled: true
      test_environments: ["development", "staging"]
      database_testing: true
      external_api_testing: true
      end_to_end_scenarios: true
  
  reporting:
    formats: ["json", "html", "junit"]
    include_screenshots: true
    include_performance_metrics: true
    include_security_scan_results: true
    real_time_notifications: true

# Monitoring & Alerting Configuration
monitoring:
  metrics_collection:
    enabled: true
    collection_interval_seconds: 30
    retention_days: 30
  
  alerting:
    enabled: true
    channels: ["email", "slack", "webhook"]
    thresholds:
      error_rate: 0.05
      response_time_ms: 2000
      availability: 0.99
      cache_hit_rate: 0.80
  
  dashboards:
    grafana:
      enabled: true
      url: "http://localhost:3001"
      api_key: "${GRAFANA_API_KEY}"
    
    custom:
      enabled: true
      refresh_interval_seconds: 10
      auto_refresh: true

# Continuous Integration Configuration
ci_integration:
  github_actions:
    enabled: true
    trigger_on: ["push", "pull_request"]
    parallel_execution: true
    artifact_retention_days: 30
  
  quality_gates:
    min_test_coverage: 80
    max_acceptable_failures: 5
    performance_regression_threshold: 0.10
    security_vulnerability_threshold: "medium"

# Logging Configuration
logging:
  level: "INFO"
  format: "json"
  output: ["file", "console"]
  file_rotation: true
  max_file_size_mb: 100
  retention_days: 7
  
  loggers:
    qa_orchestrator: "DEBUG"
    persona_testing: "INFO"
    chaos_engineering: "INFO"
    performance_testing: "INFO"
    security_testing: "WARN"

# Environment Variables
environment_variables:
  required:
    - "OPENAI_API_KEY"
    - "ANTHROPIC_API_KEY"
    - "PINECONE_API_KEY"
  
  optional:
    - "GRAFANA_API_KEY"
    - "SLACK_WEBHOOK_URL"
    - "GITHUB_TOKEN"

# Test Data Management
test_data:
  synthetic_data_generation: true
  data_anonymization: true
  test_data_refresh_interval_hours: 24
  max_test_data_size_mb: 500
  
  sample_articles:
    count: 100
    categories: ["technology", "business", "science", "politics", "sports"]
    languages: ["en"]
    date_range_days: 30

# Advanced Features
advanced_features:
  ai_powered_test_generation: true
  self_healing_tests: true
  predictive_failure_detection: true
  automated_performance_optimization: true
  intelligent_test_prioritization: true
  
  machine_learning:
    model_drift_detection: true
    anomaly_detection: true
    performance_prediction: true
    user_behavior_analysis: true

# Compliance & Governance
compliance:
  gdpr_compliance_testing: true
  accessibility_compliance: "WCAG_2_1_AA"
  security_standards: ["OWASP_TOP_10", "ISO_27001"]
  data_privacy_validation: true
  
  audit_trail:
    enabled: true
    retention_days: 365
    encryption: true
    digital_signatures: true