# Dr. Aurora "CodeForge" Synth's Agentic Code Optimizer Configuration
# Superhuman AI-Powered Code Analysis & Optimization Settings

# Global Configuration
global:
  optimization_level: "moderate"  # conservative, moderate, aggressive, experimental
  max_iterations: 3
  parallel_agents: true
  enable_chaos_testing: true
  enable_rag: true
  auto_apply_changes: false  # Set to true for fully automated optimization
  backup_before_changes: true
  
# Multi-Agent RAG Configuration
rag:
  embedding_model: "all-MiniLM-L6-v2"
  vector_store: "chromadb"
  chunk_size: 50  # lines per chunk
  chunk_overlap: 5  # lines overlap between chunks
  similarity_threshold: 0.7
  max_context_length: 4000  # tokens
  retrieval_top_k: 5
  enable_semantic_search: true
  enable_code_similarity: true
  
# Analyzer Agent Configuration
analyzer:
  # Code Quality Metrics
  complexity_threshold: 15
  maintainability_threshold: 70
  test_coverage_threshold: 80
  documentation_threshold: 70
  security_threshold: 90
  
  # Analysis Scope
  include_security: true
  include_performance: true
  include_dependencies: true
  include_hotspots: true
  include_technical_debt: true
  
  # File Types to Analyze
  file_extensions:
    - ".py"
    - ".js"
    - ".ts"
    - ".java"
    - ".go"
    - ".rs"
    - ".cpp"
    - ".c"
  
  # Exclusion Patterns
  exclude_patterns:
    - "*/node_modules/*"
    - "*/venv/*"
    - "*/env/*"
    - "*/.git/*"
    - "*/build/*"
    - "*/dist/*"
    - "*/__pycache__/*"
    - "*.pyc"
    - "*.pyo"
  
  # External Tools Integration
  tools:
    pylint:
      enabled: true
      config_file: ".pylintrc"
      fail_threshold: 8.0
    
    bandit:
      enabled: true
      config_file: ".bandit"
      severity_threshold: "medium"
    
    mypy:
      enabled: true
      config_file: "mypy.ini"
      strict_mode: false
    
    black:
      enabled: true
      line_length: 88
      target_version: "py38"
    
    isort:
      enabled: true
      profile: "black"
    
    pytest:
      enabled: true
      coverage_threshold: 80
      timeout: 300

# Generator Agent Configuration
generator:
  # Generation Parameters
  creativity_level: 0.7  # 0.0 to 1.0
  safety_checks: true
  max_suggestions_per_file: 5
  min_confidence_threshold: 0.6
  
  # Code Generation Strategies
  strategies:
    complexity_reduction:
      enabled: true
      priority: "high"
      techniques:
        - "extract_method"
        - "extract_class"
        - "simplify_conditionals"
        - "reduce_nesting"
        - "eliminate_duplicates"
    
    performance_optimization:
      enabled: true
      priority: "medium"
      techniques:
        - "optimize_loops"
        - "cache_expensive_calls"
        - "lazy_loading"
        - "batch_operations"
        - "async_optimization"
    
    security_hardening:
      enabled: true
      priority: "high"
      techniques:
        - "input_validation"
        - "sql_injection_prevention"
        - "xss_prevention"
        - "secure_random"
        - "crypto_best_practices"
    
    test_generation:
      enabled: true
      priority: "medium"
      techniques:
        - "unit_tests"
        - "integration_tests"
        - "property_based_tests"
        - "mock_generation"
        - "edge_case_tests"
    
    documentation_generation:
      enabled: true
      priority: "low"
      techniques:
        - "docstring_generation"
        - "type_annotations"
        - "api_documentation"
        - "readme_updates"
        - "code_comments"
  
  # AI Model Configuration
  model:
    provider: "anthropic"  # anthropic, openai, local
    model_name: "claude-3-sonnet"
    temperature: 0.3
    max_tokens: 4000
    context_window: 100000

# Critic Agent Configuration
critic:
  # Review Parameters
  strictness_level: 0.8  # 0.0 to 1.0
  require_tests: true
  require_documentation: true
  require_type_hints: true
  
  # Review Criteria
  criteria:
    correctness:
      weight: 0.3
      checks:
        - "syntax_validation"
        - "logic_verification"
        - "edge_case_handling"
        - "error_handling"
    
    maintainability:
      weight: 0.25
      checks:
        - "code_readability"
        - "naming_conventions"
        - "function_size"
        - "class_cohesion"
    
    performance:
      weight: 0.2
      checks:
        - "algorithmic_complexity"
        - "memory_usage"
        - "io_efficiency"
        - "caching_strategy"
    
    security:
      weight: 0.15
      checks:
        - "vulnerability_scan"
        - "input_sanitization"
        - "authentication_checks"
        - "authorization_validation"
    
    testability:
      weight: 0.1
      checks:
        - "test_coverage"
        - "mock_compatibility"
        - "dependency_injection"
        - "side_effect_isolation"
  
  # Approval Thresholds
  approval_thresholds:
    minimum_score: 0.7
    maximum_risk: 0.3
    required_confidence: 0.8
  
  # Risk Assessment
  risk_factors:
    breaking_changes: 0.9
    performance_impact: 0.7
    security_implications: 0.8
    test_coverage_reduction: 0.6
    dependency_changes: 0.5

# Refactor Agent Configuration
refactor:
  # Refactoring Strategies
  strategies:
    automated:
      enabled: true
      confidence_threshold: 0.9
      max_files_per_batch: 10
      backup_strategy: "git_stash"
    
    semi_automated:
      enabled: true
      confidence_threshold: 0.7
      require_approval: true
      preview_changes: true
    
    manual:
      enabled: true
      confidence_threshold: 0.5
      generate_suggestions: true
      create_pull_request: true
  
  # Refactoring Techniques
  techniques:
    extract_method:
      enabled: true
      min_lines: 5
      max_complexity: 10
    
    extract_class:
      enabled: true
      min_methods: 3
      cohesion_threshold: 0.7
    
    inline_method:
      enabled: true
      max_lines: 3
      single_use_only: true
    
    rename_variable:
      enabled: true
      naming_convention: "snake_case"
      avoid_abbreviations: true
    
    move_method:
      enabled: true
      coupling_threshold: 0.3
      cohesion_improvement: 0.2

# Tester Agent Configuration
tester:
  # Test Generation
  test_types:
    unit_tests:
      enabled: true
      framework: "pytest"
      coverage_target: 90
      mock_external_deps: true
    
    integration_tests:
      enabled: true
      framework: "pytest"
      test_database: "sqlite"
      cleanup_strategy: "rollback"
    
    property_tests:
      enabled: true
      framework: "hypothesis"
      max_examples: 100
      deadline: 1000  # ms
    
    performance_tests:
      enabled: true
      framework: "pytest-benchmark"
      baseline_file: "benchmarks.json"
      regression_threshold: 0.1
    
    security_tests:
      enabled: true
      framework: "bandit"
      vulnerability_db: "safety"
      scan_dependencies: true
  
  # Test Execution
  execution:
    parallel: true
    max_workers: 4
    timeout: 300  # seconds
    retry_failed: 2
    fail_fast: false
  
  # Coverage Requirements
  coverage:
    minimum_line_coverage: 80
    minimum_branch_coverage: 75
    exclude_patterns:
      - "*/tests/*"
      - "*/migrations/*"
      - "*/settings/*"

# Documenter Agent Configuration
documenter:
  # Documentation Types
  doc_types:
    api_docs:
      enabled: true
      format: "openapi"
      include_examples: true
      auto_generate: true
    
    code_docs:
      enabled: true
      format: "sphinx"
      include_type_hints: true
      docstring_style: "google"
    
    user_docs:
      enabled: true
      format: "markdown"
      include_tutorials: true
      auto_update: true
    
    architecture_docs:
      enabled: true
      format: "mermaid"
      include_diagrams: true
      dependency_graphs: true
  
  # Documentation Standards
  standards:
    docstring_coverage: 90
    api_documentation: 100
    readme_completeness: 80
    changelog_maintenance: true
  
  # Auto-generation Rules
  auto_generation:
    function_docstrings: true
    class_docstrings: true
    module_docstrings: true
    parameter_descriptions: true
    return_value_descriptions: true
    exception_documentation: true

# Chaos Engineer Agent Configuration
chaos:
  # Experiment Configuration
  experiments:
    network_faults:
      enabled: true
      types:
        - "latency_injection"
        - "packet_loss"
        - "network_partition"
        - "bandwidth_limitation"
      duration: 300  # seconds
      intensity: "medium"
    
    resource_faults:
      enabled: true
      types:
        - "memory_pressure"
        - "cpu_stress"
        - "disk_io_stress"
        - "file_descriptor_exhaustion"
      duration: 180  # seconds
      intensity: "low"
    
    application_faults:
      enabled: true
      types:
        - "exception_injection"
        - "slow_response"
        - "random_failures"
        - "dependency_unavailability"
      duration: 120  # seconds
      intensity: "medium"
    
    infrastructure_faults:
      enabled: false  # Disabled by default for safety
      types:
        - "pod_termination"
        - "node_shutdown"
        - "service_unavailability"
        - "database_connection_loss"
      duration: 60  # seconds
      intensity: "low"
  
  # Safety Configuration
  safety:
    blast_radius: "limited"  # limited, moderate, extensive
    auto_rollback: true
    rollback_timeout: 30  # seconds
    health_check_interval: 5  # seconds
    failure_threshold: 3
  
  # Monitoring and Observability
  monitoring:
    metrics:
      - "response_time"
      - "error_rate"
      - "throughput"
      - "availability"
      - "resource_utilization"
    
    alerts:
      - "sla_violation"
      - "error_spike"
      - "performance_degradation"
      - "service_unavailability"
    
    dashboards:
      - "chaos_experiment_status"
      - "system_health"
      - "performance_metrics"
      - "error_tracking"
  
  # Success Criteria
  success_criteria:
    availability_threshold: 99.0  # percentage
    response_time_p95: 2000  # milliseconds
    error_rate_threshold: 0.05  # 5%
    recovery_time_max: 60  # seconds
    data_consistency: 100.0  # percentage

# Orchestrator Configuration
orchestrator:
  # Workflow Management
  workflow:
    execution_mode: "sequential"  # sequential, parallel, hybrid
    retry_strategy: "exponential_backoff"
    max_retries: 3
    timeout: 3600  # seconds
  
  # Agent Coordination
  coordination:
    communication_protocol: "async"
    state_management: "centralized"
    conflict_resolution: "priority_based"
    load_balancing: "round_robin"
  
  # Progress Tracking
  tracking:
    enable_metrics: true
    log_level: "info"
    progress_reporting: "real_time"
    checkpoint_frequency: 60  # seconds

# Headless CI/CD Integration
ci_cd:
  # Pipeline Integration
  integration:
    github_actions: true
    gitlab_ci: true
    jenkins: true
    azure_devops: true
  
  # Automated Triggers
  triggers:
    on_pull_request: true
    on_merge: true
    on_schedule: "0 2 * * 1"  # Weekly on Monday at 2 AM
    on_dependency_update: true
  
  # Quality Gates
  quality_gates:
    code_coverage: 80
    security_score: 90
    performance_regression: 0.1
    complexity_increase: 0.05
  
  # Notifications
  notifications:
    slack:
      enabled: false
      webhook_url: ""
      channels:
        - "#dev-team"
        - "#code-quality"
    
    email:
      enabled: false
      recipients:
        - "dev-team@company.com"
        - "tech-lead@company.com"
    
    github:
      enabled: true
      create_issues: true
      comment_on_pr: true

# Neural Cache & Prefetch Intelligence
caching:
  # Intelligent Caching
  neural_cache:
    enabled: true
    cache_size: "1GB"
    eviction_policy: "lru"
    prediction_model: "lstm"
  
  # Prefetch Strategy
  prefetch:
    enabled: true
    prediction_window: 3600  # seconds
    confidence_threshold: 0.8
    max_prefetch_size: "100MB"
  
  # Cache Optimization
  optimization:
    auto_tune: true
    performance_monitoring: true
    hit_rate_threshold: 0.8
    latency_improvement: 0.3

# Logging and Monitoring
logging:
  level: "info"  # debug, info, warning, error, critical
  format: "structured"  # simple, structured, json
  output:
    console: true
    file: true
    remote: false
  
  # Log Rotation
  rotation:
    max_size: "100MB"
    backup_count: 5
    compress: true
  
  # Structured Logging
  structured:
    include_timestamp: true
    include_level: true
    include_module: true
    include_function: true
    include_line_number: true

# Performance Monitoring
monitoring:
  # Metrics Collection
  metrics:
    enabled: true
    collection_interval: 30  # seconds
    retention_period: "30d"
    aggregation_window: "5m"
  
  # APM Integration
  apm:
    provider: "datadog"  # datadog, newrelic, elastic
    trace_sampling: 0.1
    profile_cpu: true
    profile_memory: true
  
  # Custom Metrics
  custom_metrics:
    optimization_duration: true
    code_quality_score: true
    refactoring_success_rate: true
    chaos_experiment_results: true

# Security Configuration
security:
  # Secrets Management
  secrets:
    provider: "vault"  # vault, aws_secrets, azure_keyvault
    auto_rotation: true
    encryption_at_rest: true
    encryption_in_transit: true
  
  # Access Control
  access_control:
    authentication: "oauth2"
    authorization: "rbac"
    session_timeout: 3600  # seconds
    mfa_required: false
  
  # Vulnerability Scanning
  vulnerability_scanning:
    enabled: true
    scan_frequency: "daily"
    severity_threshold: "medium"
    auto_remediation: false

# Resource Management
resources:
  # Compute Resources
  compute:
    max_cpu_cores: 8
    max_memory: "16GB"
    max_disk_space: "100GB"
    gpu_acceleration: false
  
  # Concurrency Limits
  concurrency:
    max_parallel_agents: 4
    max_parallel_files: 10
    max_parallel_experiments: 2
    queue_size: 100
  
  # Resource Monitoring
  monitoring:
    cpu_threshold: 80  # percentage
    memory_threshold: 85  # percentage
    disk_threshold: 90  # percentage
    auto_scaling: false