name: 🚀 Dr. Orion TestMaster - Superhuman QA Pipeline

# Comprehensive CI/CD pipeline for AI News Dashboard
# Implements persona-based testing, AI inference validation, chaos engineering,
# neural cache diagnostics, and multi-agent QA automation

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly chaos tests at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - persona
          - ai_inference
          - chaos
          - neural_cache
          - multi_agent
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - development
      chaos_intensity:
        description: 'Chaos engineering intensity (1-10)'
        required: false
        default: '5'
        type: string

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'
  QA_REPORTS_RETENTION_DAYS: 30
  SUPERHUMAN_QA_VERSION: '1.0.0'

jobs:
  # ============================================================================
  # SETUP & VALIDATION
  # ============================================================================
  setup-validation:
    name: 🔍 Setup & Environment Validation
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.test-matrix.outputs.matrix }}
      environment: ${{ steps.environment.outputs.env }}
      chaos-enabled: ${{ steps.chaos-check.outputs.enabled }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 🔧 Install Dependencies
        run: |
          # Install Python dependencies
          cd qa
          pip install -r requirements.txt
          
          # Install Node.js dependencies
          cd ..
          npm ci
      
      - name: 🏗️ Build Application
        run: |
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      
      - name: 🧪 Generate Test Matrix
        id: test-matrix
        run: |
          python qa/generate_test_matrix.py \
            --suite "${{ github.event.inputs.test_suite || 'full' }}" \
            --output matrix.json
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT
      
      - name: 🌍 Determine Environment
        id: environment
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "env=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=development" >> $GITHUB_OUTPUT
          fi
      
      - name: 🌪️ Check Chaos Engineering
        id: chaos-check
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.event.inputs.test_suite }}" == "chaos" ]] || [[ "${{ github.event.inputs.test_suite }}" == "full" ]]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # PERSONA-BASED TESTING
  # ============================================================================
  persona-testing:
    name: 👥 Persona-Based Testing
    runs-on: ubuntu-latest
    needs: setup-validation
    if: contains(fromJson(needs.setup-validation.outputs.test-matrix), 'persona')
    
    strategy:
      matrix:
        persona: 
          - casual_reader
          - financial_analyst
          - mobile_user
          - power_user
          - accessibility_user
        browser:
          - chrome
          - firefox
          - edge
      fail-fast: false
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python & Dependencies
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Setup Node.js & Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 🔧 Install Dependencies
        run: |
          cd qa && pip install -r requirements.txt
          npm ci
      
      - name: 🌐 Setup Browser Drivers
        run: |
          python -c "from webdriver_manager.chrome import ChromeDriverManager; ChromeDriverManager().install()"
          python -c "from webdriver_manager.firefox import GeckoDriverManager; GeckoDriverManager().install()"
          python -c "from webdriver_manager.microsoft import EdgeChromiumDriverManager; EdgeChromiumDriverManager().install()"
      
      - name: 🚀 Start Application
        run: |
          npm run build
          npm start &
          sleep 30  # Wait for application to start
        env:
          PORT: 3000
          NEXT_TELEMETRY_DISABLED: 1
      
      - name: 🧪 Run Persona Tests
        run: |
          cd qa
          python run_qa_suite.py \
            --config config.yaml \
            --test-type persona \
            --persona ${{ matrix.persona }} \
            --browser ${{ matrix.browser }} \
            --environment ${{ needs.setup-validation.outputs.environment }} \
            --output-dir reports/persona_${{ matrix.persona }}_${{ matrix.browser }}
        env:
          DASHBOARD_URL: http://localhost:3000
          HEADLESS: true
          SCREENSHOT_ON_FAILURE: true
      
      - name: 📊 Upload Persona Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-results-${{ matrix.persona }}-${{ matrix.browser }}
          path: qa/reports/persona_${{ matrix.persona }}_${{ matrix.browser }}/
          retention-days: ${{ env.QA_REPORTS_RETENTION_DAYS }}
      
      - name: 📸 Upload Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: persona-screenshots-${{ matrix.persona }}-${{ matrix.browser }}
          path: qa/screenshots/
          retention-days: 7

  # ============================================================================
  # AI INFERENCE VALIDATION
  # ============================================================================
  ai-inference-validation:
    name: 🤖 AI Inference Validation
    runs-on: ubuntu-latest
    needs: setup-validation
    if: contains(fromJson(needs.setup-validation.outputs.test-matrix), 'ai_inference')
    
    strategy:
      matrix:
        model:
          - gpt-4o
          - claude-3.5-sonnet
          - local-llm
        test_type:
          - summarization
          - rag_search
          - news_filtering
          - sentiment_analysis
      fail-fast: false
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python & Dependencies
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Setup Node.js & Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 🔧 Install Dependencies
        run: |
          cd qa && pip install -r requirements.txt
          npm ci
      
      - name: 🚀 Start Application
        run: |
          npm run build
          npm start &
          sleep 30
        env:
          PORT: 3000
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      
      - name: 🧠 Run AI Inference Tests
        run: |
          cd qa
          python run_qa_suite.py \
            --config config.yaml \
            --test-type ai_inference \
            --model ${{ matrix.model }} \
            --inference-type ${{ matrix.test_type }} \
            --environment ${{ needs.setup-validation.outputs.environment }} \
            --output-dir reports/ai_inference_${{ matrix.model }}_${{ matrix.test_type }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          DASHBOARD_URL: http://localhost:3000
      
      - name: 📊 Upload AI Inference Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-inference-results-${{ matrix.model }}-${{ matrix.test_type }}
          path: qa/reports/ai_inference_${{ matrix.model }}_${{ matrix.test_type }}/
          retention-days: ${{ env.QA_REPORTS_RETENTION_DAYS }}
      
      - name: 🚨 Check Inference Drift
        run: |
          cd qa
          python check_inference_drift.py \
            --model ${{ matrix.model }} \
            --test-type ${{ matrix.test_type }} \
            --threshold 0.15 \
            --alert-webhook ${{ secrets.SLACK_WEBHOOK_URL }}

  # ============================================================================
  # CHAOS ENGINEERING
  # ============================================================================
  chaos-engineering:
    name: 🌪️ Chaos Engineering
    runs-on: ubuntu-latest
    needs: setup-validation
    if: needs.setup-validation.outputs.chaos-enabled == 'true'
    
    strategy:
      matrix:
        experiment:
          - network_latency
          - cache_eviction
          - api_failure
          - database_stress
          - memory_pressure
          - edge_function_failure
        intensity: [3, 5, 7]
      fail-fast: false
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python & Dependencies
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Setup Node.js & Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 🔧 Install Dependencies
        run: |
          cd qa && pip install -r requirements.txt
          npm ci
      
      - name: 🐳 Setup Docker for Chaos
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo usermod -aG docker $USER
      
      - name: 🚀 Start Application with Monitoring
        run: |
          npm run build
          npm start &
          sleep 30
        env:
          PORT: 3000
          ENABLE_MONITORING: true
      
      - name: 🌪️ Run Chaos Experiment
        run: |
          cd qa
          python run_qa_suite.py \
            --config config.yaml \
            --test-type chaos \
            --experiment ${{ matrix.experiment }} \
            --intensity ${{ matrix.intensity }} \
            --duration 300 \
            --environment ${{ needs.setup-validation.outputs.environment }} \
            --output-dir reports/chaos_${{ matrix.experiment }}_${{ matrix.intensity }}
        env:
          DASHBOARD_URL: http://localhost:3000
          CHAOS_INTENSITY: ${{ github.event.inputs.chaos_intensity || matrix.intensity }}
      
      - name: 📊 Upload Chaos Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-results-${{ matrix.experiment }}-${{ matrix.intensity }}
          path: qa/reports/chaos_${{ matrix.experiment }}_${{ matrix.intensity }}/
          retention-days: ${{ env.QA_REPORTS_RETENTION_DAYS }}
      
      - name: 🚨 Alert on Chaos Failures
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-type: application/json' \
            --data '{
              "text": "🚨 Chaos Engineering Alert",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Chaos Experiment Failed*\n*Experiment:* ${{ matrix.experiment }}\n*Intensity:* ${{ matrix.intensity }}\n*Environment:* ${{ needs.setup-validation.outputs.environment }}\n*Repository:* ${{ github.repository }}\n*Commit:* ${{ github.sha }}"
                  }
                }
              ]
            }'

  # ============================================================================
  # NEURAL CACHE & PREFETCH DIAGNOSTICS
  # ============================================================================
  neural-cache-diagnostics:
    name: 🧠 Neural Cache & Prefetch Diagnostics
    runs-on: ubuntu-latest
    needs: setup-validation
    if: contains(fromJson(needs.setup-validation.outputs.test-matrix), 'neural_cache')
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python & Dependencies
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Setup Node.js & Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 🔧 Install Dependencies
        run: |
          cd qa && pip install -r requirements.txt
          npm ci
      
      - name: 🚀 Start Application with Cache Monitoring
        run: |
          npm run build
          npm start &
          sleep 30
        env:
          PORT: 3000
          REDIS_URL: redis://localhost:6379
          ENABLE_CACHE_MONITORING: true
      
      - name: 🧠 Run Neural Cache Analysis
        run: |
          cd qa
          python run_qa_suite.py \
            --config config.yaml \
            --test-type neural_cache \
            --cache-types redis,browser,cdn,isr \
            --prefetch-analysis true \
            --vector-store-analysis true \
            --environment ${{ needs.setup-validation.outputs.environment }} \
            --output-dir reports/neural_cache
        env:
          DASHBOARD_URL: http://localhost:3000
          REDIS_URL: redis://localhost:6379
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      
      - name: 📊 Upload Cache Diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neural-cache-diagnostics
          path: qa/reports/neural_cache/
          retention-days: ${{ env.QA_REPORTS_RETENTION_DAYS }}
      
      - name: 🎯 Generate Cache Optimization Recommendations
        run: |
          cd qa
          python generate_cache_recommendations.py \
            --input reports/neural_cache \
            --output cache_optimization_plan.md \
            --format markdown
      
      - name: 📝 Upload Optimization Plan
        uses: actions/upload-artifact@v4
        with:
          name: cache-optimization-plan
          path: qa/cache_optimization_plan.md
          retention-days: ${{ env.QA_REPORTS_RETENTION_DAYS }}

  # ============================================================================
  # MULTI-AGENT QA PIPELINE
  # ============================================================================
  multi-agent-qa:
    name: 🤖 Multi-Agent QA Pipeline
    runs-on: ubuntu-latest
    needs: setup-validation
    if: contains(fromJson(needs.setup-validation.outputs.test-matrix), 'multi_agent')
    
    strategy:
      matrix:
        agent:
          - functional
          - performance
          - security
          - accessibility
          - cross_browser
          - api
          - integration
      fail-fast: false
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python & Dependencies
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Setup Node.js & Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 🔧 Install Dependencies
        run: |
          cd qa && pip install -r requirements.txt
          npm ci
      
      - name: 🛡️ Setup Security Tools (for security agent)
        if: matrix.agent == 'security'
        run: |
          # Install OWASP ZAP
          wget -q https://github.com/zaproxy/zaproxy/releases/download/v2.14.0/ZAP_2_14_0_unix.sh
          chmod +x ZAP_2_14_0_unix.sh
          sudo ./ZAP_2_14_0_unix.sh -q
      
      - name: 🚀 Start Application
        run: |
          npm run build
          npm start &
          sleep 30
        env:
          PORT: 3000
      
      - name: 🤖 Run Multi-Agent Tests
        run: |
          cd qa
          python run_qa_suite.py \
            --config config.yaml \
            --test-type multi_agent \
            --agent ${{ matrix.agent }} \
            --parallel-execution true \
            --environment ${{ needs.setup-validation.outputs.environment }} \
            --output-dir reports/multi_agent_${{ matrix.agent }}
        env:
          DASHBOARD_URL: http://localhost:3000
          AGENT_TYPE: ${{ matrix.agent }}
      
      - name: 📊 Upload Multi-Agent Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-agent-results-${{ matrix.agent }}
          path: qa/reports/multi_agent_${{ matrix.agent }}/
          retention-days: ${{ env.QA_REPORTS_RETENTION_DAYS }}

  # ============================================================================
  # PERFORMANCE BENCHMARKING
  # ============================================================================
  performance-benchmarking:
    name: ⚡ Performance Benchmarking
    runs-on: ubuntu-latest
    needs: setup-validation
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js & Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 🔧 Install Dependencies
        run: npm ci
      
      - name: 🚀 Build & Start Application
        run: |
          npm run build
          npm start &
          sleep 30
        env:
          PORT: 3000
      
      - name: 🏃 Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './qa/lighthouse-config.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
      
      - name: ⚡ Run Load Testing
        run: |
          cd qa
          python performance_tests.py \
            --url http://localhost:3000 \
            --users 100 \
            --duration 300 \
            --ramp-up 60
      
      - name: 📊 Upload Performance Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: qa/reports/performance/
          retention-days: ${{ env.QA_REPORTS_RETENTION_DAYS }}

  # ============================================================================
  # REPORT AGGREGATION & ANALYSIS
  # ============================================================================
  aggregate-results:
    name: 📊 Aggregate Results & Generate Reports
    runs-on: ubuntu-latest
    needs: 
      - setup-validation
      - persona-testing
      - ai-inference-validation
      - chaos-engineering
      - neural-cache-diagnostics
      - multi-agent-qa
      - performance-benchmarking
    if: always()
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python & Dependencies
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 🔧 Install Dependencies
        run: |
          cd qa && pip install -r requirements.txt
      
      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: qa/artifacts/
      
      - name: 📊 Generate Comprehensive Report
        run: |
          cd qa
          python generate_comprehensive_report.py \
            --artifacts-dir artifacts/ \
            --output-dir reports/comprehensive/ \
            --format html,json,pdf \
            --include-recommendations true \
            --environment ${{ needs.setup-validation.outputs.environment }}
      
      - name: 🎯 Calculate Quality Score
        run: |
          cd qa
          python calculate_quality_score.py \
            --reports-dir reports/comprehensive/ \
            --output quality_score.json
      
      - name: 📈 Update Quality Metrics
        run: |
          cd qa
          python update_quality_metrics.py \
            --score-file quality_score.json \
            --commit-sha ${{ github.sha }} \
            --branch ${{ github.ref_name }}
      
      - name: 📊 Upload Comprehensive Report
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-qa-report
          path: qa/reports/comprehensive/
          retention-days: ${{ env.QA_REPORTS_RETENTION_DAYS }}
      
      - name: 📝 Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const qualityScore = JSON.parse(fs.readFileSync('qa/quality_score.json', 'utf8'));
            
            const comment = `## 🚀 Dr. Orion TestMaster - QA Report
            
            **Overall Quality Score: ${qualityScore.overall_score}/100** ${qualityScore.overall_score >= 90 ? '🟢' : qualityScore.overall_score >= 70 ? '🟡' : '🔴'}
            
            ### Test Results Summary
            - **Persona Testing**: ${qualityScore.persona_score}/100
            - **AI Inference**: ${qualityScore.ai_inference_score}/100
            - **Chaos Engineering**: ${qualityScore.chaos_score}/100
            - **Neural Cache**: ${qualityScore.cache_score}/100
            - **Multi-Agent QA**: ${qualityScore.multi_agent_score}/100
            - **Performance**: ${qualityScore.performance_score}/100
            
            ### Key Recommendations
            ${qualityScore.recommendations.map(rec => `- ${rec}`).join('\n')}
            
            [📊 View Detailed Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: 🚨 Quality Gate Check
        run: |
          cd qa
          python quality_gate_check.py \
            --score-file quality_score.json \
            --minimum-score 70 \
            --fail-on-regression true

  # ============================================================================
  # NOTIFICATIONS & ALERTS
  # ============================================================================
  notifications:
    name: 📢 Notifications & Alerts
    runs-on: ubuntu-latest
    needs: aggregate-results
    if: always()
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 📥 Download Quality Score
        uses: actions/download-artifact@v4
        with:
          name: comprehensive-qa-report
          path: qa/reports/
      
      - name: 📧 Send Email Report
        if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚀 Dr. Orion TestMaster - Daily QA Report"
          body: file://qa/reports/email_report.html
          html_body: true
          to: ${{ secrets.QA_TEAM_EMAIL }}
          attachments: qa/reports/comprehensive_report.pdf
      
      - name: 📱 Slack Notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#qa-alerts'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          custom_payload: |
            {
              "text": "🚀 Dr. Orion TestMaster - QA Pipeline Complete",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*QA Pipeline Status*: ${{ job.status }}\n*Repository*: ${{ github.repository }}\n*Branch*: ${{ github.ref_name }}\n*Commit*: ${{ github.sha }}\n*Environment*: ${{ needs.setup-validation.outputs.environment }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Report"
                      },
                      "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
      
      - name: 📊 Update Dashboard
        run: |
          curl -X POST ${{ secrets.GRAFANA_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "dashboard": "qa-metrics",
              "timestamp": "${{ github.event.head_commit.timestamp }}",
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "status": "${{ job.status }}",
              "environment": "${{ needs.setup-validation.outputs.environment }}"
            }'

# ============================================================================
# WORKFLOW CONFIGURATION
# ============================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read
  checks: write