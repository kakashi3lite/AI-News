# Market Signal — Cloudflare Workers + D1 (server mode)
# ------------------------------------------------------------------
# The static dashboard (GitHub Pages) reads JSON snapshots. This worker serves
# the LIVE server mode: real-time ingestion API, SQLite-compatible D1 database,
# cron triggers, and the email digest — all on Cloudflare's edge (free tier).
#
# Setup: see docs/DEPLOY_CLOUDFLARE.md
name = "market-signal"
compatibility_date = "2025-08-05"
compatibility_flags = ["nodejs_compat"]

# Entry set by @cloudflare/next-on-pages (builds the Next.js app for Workers)
# main = ".open-next/worker.js"   (generated by the build)

# D1 database — serverless SQLite. Our Prisma schema ports 1:1.
# Create it with:  npx wrangler d1 create market-signal-db
# Then paste the returned database_id below and apply the schema:
#   npx wrangler d1 execute market-signal-db --file=prisma/d1-migration.sql
#   npx wrangler d1 execute market-signal-db --file=prisma/d1-seed.sql
[[d1_databases]]
binding = "DB"
database_name = "market-signal-db"
database_id = "REPLACE_WITH_CREATED_DATABASE_ID"

# Cron triggers → real-time ingestion (30 min) + daily digest email (07:00)
[triggers]
crons = ["*/30 * * * *", "0 7 * * *"]

# Environment variables (set with npx wrangler secret put)
# CRON_SECRET            — bearer token guarding /api/cron/*
# OPENAI_API_KEY         — optional AI summaries
# SMTP_HOST/PORT/USER/PASS/FROM — email digest
# DIGEST_EMAILS          — comma-separated recipients
